<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profit & Loss Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --green: #22c55e;
            --red: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 15px;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
        }

        h2 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--text-main);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px;
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--accent-color);
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 12px 16px;
            font-weight: 600;
            font-size: 0.95rem;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: #fff;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
        }

        .btn-reset {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
        }

        .btn-reset:hover {
            background-color: var(--border-color);
            color: var(--text-main);
        }

        button:active {
            transform: scale(0.98);
        }

        .sim-results {
            background: #0f172a;
            border-radius: 8px;
            padding: 16px;
            margin-top: 20px;
            border: 1px dashed var(--border-color);
        }

        .sim-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 0.95rem;
        }

        .sim-row:last-child {
            margin-bottom: 0;
            padding-top: 10px;
            border-top: 1px solid var(--border-color);
            font-weight: bold;
            font-size: 1.05rem;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>📈 Trading Simulator</h2>
        
        <div class="form-group">
            <label for="tradeAmount">Jumlah Amount (Modal / Entry Value)</label>
            <input type="number" id="tradeAmount" step="any" placeholder="Contoh: 0.6 atau 100">
        </div>

        <div class="form-group">
            <label for="percentage">Target / Perubahan (%)</label>
            <input type="number" id="percentage" step="any" placeholder="Contoh: 20 (gunakan -20 untuk Rugi)">
        </div>

        <div class="btn-group">
            <button id="calcBtn" class="btn-primary">Hitung</button>
            <button id="resetSimBtn" class="btn-reset">Reset</button>
        </div>

        <!-- Output Simulasi -->
        <div id="simulationResult" class="sim-results" style="display: none;">
            <div class="sim-row">
                <span>Nilai Perubahan:</span>
                <span id="resValueChange" style="font-weight: bold;">-</span>
            </div>
            <div class="sim-row">
                <span>Total Akhir:</span>
                <span id="resTotalResult">-</span>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const tradeAmountInput = document.getElementById('tradeAmount');
            const percentageInput = document.getElementById('percentage');
            const calcBtn = document.getElementById('calcBtn');
            const resetSimBtn = document.getElementById('resetSimBtn');
            const simResultDiv = document.getElementById('simulationResult');

            // LOGIC KALKULATOR
            calcBtn.addEventListener('click', function () {
                const amount = parseFloat(tradeAmountInput.value);
                const percent = parseFloat(percentageInput.value);

                if (isNaN(amount) || isNaN(percent)) {
                    alert('Harap isi Amount dan Persentase dengan benar!');
                    return;
                }

                // Perhitungan:
                // Misal: Amount = 0.6, Percent = 20%
                // Nilai Perubahan = 0.6 * (20 / 100) = 0.12
                // Total Akhir = 0.6 + 0.12 = 0.72
                const valueChange = amount * (percent / 100); 
                const totalResult = amount + valueChange;

                // Format Tampilan
                const isProfit = percent >= 0;
                const colorClass = isProfit ? 'var(--green)' : 'var(--red)';
                const sign = isProfit ? '+' : '';

                // Tampilkan Nilai Perubahan (misal +0.12)
                document.getElementById('resValueChange').innerText = `${sign}${valueChange.toFixed(4)}`;
                document.getElementById('resValueChange').style.color = colorClass;

                // Tampilkan Total Akhir (misal 0.72)
                document.getElementById('resTotalResult').innerText = `${totalResult.toFixed(4)}`;
                document.getElementById('resTotalResult').style.color = colorClass;

                simResultDiv.style.display = 'block';
            });

            // LOGIC RESET
            resetSimBtn.addEventListener('click', function () {
                tradeAmountInput.value = '';
                percentageInput.value = '';
                simResultDiv.style.display = 'none';
            });
        });
    </script>
</body>
</html>
