<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Token Info & Trade Simulator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --green: #22c55e;
            --red: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            padding: 30px 15px;
        }

        .main-wrapper {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        h2 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--text-main);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .form-group {
            margin-bottom: 14px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 10px 12px;
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--accent-color);
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        button {
            flex: 1;
            padding: 10px 16px;
            font-weight: 600;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: #fff;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
        }

        .btn-reset {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
        }

        .btn-reset:hover {
            background-color: var(--border-color);
            color: var(--text-main);
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Result Display Styles */
        .info-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 16px;
            font-size: 0.9rem;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            background: #0f172a;
            padding: 10px;
            border-radius: 6px;
        }

        .badge {
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 600;
        }

        .green {
            color: var(--green);
            background: rgba(34, 197, 94, 0.1);
        }

        .red {
            color: var(--red);
            background: rgba(239, 68, 68, 0.1);
        }

        .sim-results {
            background: #0f172a;
            border-radius: 8px;
            padding: 16px;
            margin-top: 16px;
            border: 1px dashed var(--border-color);
        }

        .sim-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .sim-row:last-child {
            margin-bottom: 0;
            padding-top: 8px;
            border-top: 1px solid var(--border-color);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <!-- Card 1: Token Checker -->
        <div class="card">
            <h2>🔍 Check Token Info</h2>
            <div class="form-group">
                <label for="tokenAddress">Alamat Kontrak Token (Solana)</label>
                <input type="text" id="tokenAddress" placeholder="Masukkan Token Address">
            </div>
            <button id="getTokenInfoBtn" class="btn-primary" style="width: 100%;">Get Token Info</button>
            <div id="tokenInfo"></div>
        </div>

        <!-- Card 2: Simulator Profit / Loss -->
        <div class="card">
            <h2>📈 Trading Simulator</h2>
            
            <div class="form-group">
                <label for="entryPrice">Harga Entry ($)</label>
                <input type="number" id="entryPrice" step="any" placeholder="Contoh: 0.6">
            </div>

            <div class="form-group">
                <label for="tradeAmount">Jumlah Modal / Token (Amount)</label>
                <input type="number" id="tradeAmount" step="any" placeholder="Contoh: 100 atau 1">
            </div>

            <div class="form-group">
                <label for="percentage">Target / Perubahan (%)</label>
                <input type="number" id="percentage" step="any" placeholder="Contoh: 20 (gunakan -20 untuk Rugi)">
            </div>

            <div class="btn-group">
                <button id="calcBtn" class="btn-primary">Hitung</button>
                <button id="resetSimBtn" class="btn-reset">Reset</button>
            </div>

            <!-- Output Simulasi -->
            <div id="simulationResult" class="sim-results" style="display: none;">
                <div class="sim-row">
                    <span>Target Perubahan Nilai:</span>
                    <span id="resValueChange" style="font-weight: bold;">-</span>
                </div>
                <div class="sim-row">
                    <span>Harga Target Sell:</span>
                    <span id="resTargetPrice">-</span>
                </div>
                <div class="sim-row">
                    <span>Total Estimasi PNL:</span>
                    <span id="resTotalPNL">-</span>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // Element Token Info
            const getTokenInfoBtn = document.getElementById('getTokenInfoBtn');
            const tokenAddressInput = document.getElementById('tokenAddress');
            const tokenInfoDiv = document.getElementById('tokenInfo');

            // Element Simulator
            const entryPriceInput = document.getElementById('entryPrice');
            const tradeAmountInput = document.getElementById('tradeAmount');
            const percentageInput = document.getElementById('percentage');
            const calcBtn = document.getElementById('calcBtn');
            const resetSimBtn = document.getElementById('resetSimBtn');
            const simResultDiv = document.getElementById('simulationResult');

            // --- 1. LOGIC TOKEN INFO ---
            getTokenInfoBtn.addEventListener('click', async function () {
                const tokenAddress = tokenAddressInput.value.trim();
                if (!tokenAddress) {
                    alert('Harap masukkan alamat token terlebih dahulu!');
                    return;
                }

                getTokenInfoBtn.disabled = true;
                tokenInfoDiv.innerHTML = '<p style="margin-top: 15px; color: var(--text-muted);">Memuat data token...</p>';

                try {
                    const response = await axios.get(`https://api.solanatracker.io/tokens/${tokenAddress}/details`);
                    const tokenData = response.data;

                    let mintableColor = tokenData.security.mintable ? 'red' : 'green';
                    let renounceColor = tokenData.security.renounce ? 'green' : 'red';
                    let freezeableColor = tokenData.security.freezeAble === null ? 'green' : tokenData.security.freezeAble ? 'red' : 'green';
                    let lpBurnColor = tokenData.lpBurn === 100 ? 'green' : 'red';

                    tokenInfoDiv.innerHTML = `
                        <div class="info-grid">
                            <div class="info-row">
                                <span>Mintable:</span>
                                <span class="badge ${mintableColor}">${tokenData.security.mintable}</span>
                            </div>
                            <div class="info-row">
                                <span>Renounce:</span>
                                <span class="badge ${renounceColor}">${tokenData.security.renounce}</span>
                            </div>
                            <div class="info-row">
                                <span>Freezeable:</span>
                                <span class="badge ${freezeableColor}">${tokenData.security.freezeAble}</span>
                            </div>
                            <div class="info-row">
                                <span>LP Burned:</span>
                                <span class="badge ${lpBurnColor}">${tokenData.lpBurn}%</span>
                            </div>
                        </div>
                    `;
                } catch (error) {
                    console.error("Error fetching token data:", error);
                    tokenInfoDiv.innerHTML = '<p style="margin-top: 15px; color: var(--red);">Gagal mengambil data token.</p>';
                } finally {
                    getTokenInfoBtn.disabled = false;
                }
            });

            // --- 2. LOGIC TRADING SIMULATOR ---
            calcBtn.addEventListener('click', function () {
                const entry = parseFloat(entryPriceInput.value);
                const amount = parseFloat(tradeAmountInput.value);
                const percent = parseFloat(percentageInput.value);

                if (isNaN(entry) || isNaN(amount) || isNaN(percent)) {
                    alert('Harap isi semua bidang input angka dengan benar!');
                    return;
                }

                // Perhitungan
                // Misal: entry 0.6, percent 20% -> Perubahan nilai per unit = 0.6 * (20 / 100) = 0.12
                const valueChangePerUnit = entry * (percent / 100); 
                const targetPrice = entry + valueChangePerUnit;
                const totalPNL = valueChangePerUnit * amount;

                // Format Tampilan
                const isProfit = percent >= 0;
                const colorClass = isProfit ? 'var(--green)' : 'var(--red)';
                const sign = isProfit ? '+' : '';

                document.getElementById('resValueChange').innerText = `${sign}${valueChangePerUnit.toFixed(4)}`;
                document.getElementById('resValueChange').style.color = colorClass;

                document.getElementById('resTargetPrice').innerText = `$${targetPrice.toFixed(4)}`;
                
                document.getElementById('resTotalPNL').innerText = `${sign}$${totalPNL.toFixed(2)}`;
                document.getElementById('resTotalPNL').style.color = colorClass;

                simResultDiv.style.display = 'block';
            });

            // RESET BUTTON SIMULATOR
            resetSimBtn.addEventListener('click', function () {
                entryPriceInput.value = '';
                tradeAmountInput.value = '';
                percentageInput.value = '';
                simResultDiv.style.display = 'none';
            });
        });
    </script>
</body>
</html>
